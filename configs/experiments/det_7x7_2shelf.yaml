# Exp 24: 7x7 grid + 2 static shelves + deterministic adversary, multi-layout.
# Tests whether the 3.22x OOD advantage on 7x7 (Exp 3) survives denser obstacles.
# State space: 49 x 49 x 4 = 9,604 (shelves not encoded). Multi-layout (10 layouts).

project:
  grid_size: 7

run:
  debug:
    train_episodes: 40000

training:
  shelf_count: 2
  num_train_layouts: 10

rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0

eval:
  ood_layout_count: 10

experiment: {}
scenarios: {}
