# Option A: Proximity-based dynamic slot encoding — Deterministic adversary.
# Replaces full adversary/forklift position (25 values) with 5-bucket directional
# proximity (not-nearby / N / S / E / W, radius=2). State space: 25*5*4 = 500.
# Semantics are consistent across adversary and nature training scenarios since
# both encode their dynamic entity (adversary or nearest forklift) the same way.

run:
  debug:
    train_episodes: 40000

state_features:
  adversary_proximity_radius: 2

eval:
  ood_layout_count: 10

experiment: {}
training: {}
rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0
scenarios: {}
