# Option C: Coarse destination direction — Deterministic adversary.
# Adds 81-value octant encoding of (pkg direction, destination direction) from
# the agent's perspective. State space: 25*25*4*81 = 202,500.
# Unlike include_relative_package_destination (6561x multiplier), this is
# layout-relative not position-absolute, so it generalizes across OOD layouts.

run:
  debug:
    train_episodes: 40000

state_features:
  include_coarse_destination_direction: true

eval:
  ood_layout_count: 10

experiment: {}
training: {}
rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0
scenarios: {}
