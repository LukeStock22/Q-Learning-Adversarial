# Option A: Proximity-based dynamic slot encoding — Learned adversary (zero-sum).
# Combines la_zs_no_rdest settings (small state space, distance shaping) with
# proximity encoding. State space: 25*5*4 = 500 for BOTH scenarios, making
# A->N cross-evaluation semantically consistent (both use proximity direction
# for their dynamic entity: adversary during training, nearest forklift during eval).

rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0

run:
  debug:
    train_episodes: 40000

state_features:
  adversary_proximity_radius: 2

scenarios:
  adversary:
    adversary_policy: learning
    adversary_learning_objective: zero_sum
    adversary_move_prob: 1.0
    adversary_learning_epsilon_start: 0.8
    adversary_learning_epsilon_end: 0.05
    adversary_learning_epsilon_decay_episodes: 20000
    adversary_learning_alpha: 0.3

eval:
  ood_layout_count: 10

experiment: {}
training: {}
