# Option C: Coarse destination direction — Learned adversary (zero-sum).
# Adds octant destination direction to la_zs_no_rdest base.
# State space: 25*25*4*81 = 202,500. Larger than no_rdest (2,500) but
# direction features are layout-relative so they generalize across OOD layouts.

rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0

run:
  debug:
    train_episodes: 40000

state_features:
  include_coarse_destination_direction: true

scenarios:
  adversary:
    adversary_policy: learning
    adversary_learning_objective: zero_sum
    adversary_move_prob: 1.0
    adversary_learning_epsilon_start: 0.8
    adversary_learning_epsilon_end: 0.05
    adversary_learning_epsilon_decay_episodes: 20000
    adversary_learning_alpha: 0.3

eval:
  ood_layout_count: 10

experiment: {}
training: {}
