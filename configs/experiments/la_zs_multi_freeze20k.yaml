# Exp 19: Multi-layout + learned adversary with freeze at episode 20k.
# 10 training layouts; each layout has its own adversary Q-table.
# With 40k total episodes across 10 layouts, each adversary gets ~4k episodes
# of training before the global freeze at 20k. After freeze, adversary acts
# near-greedily (epsilon=0.05) on its partially-learned pursuit policy.
# Delivery agent trains against 10 stable (frozen) adversaries for final 20k episodes.
# Tests whether layout diversity + non-stationary removal can combine effectively.

rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0

run:
  debug:
    train_episodes: 40000

training:
  num_train_layouts: 10

scenarios:
  adversary:
    adversary_policy: learning
    adversary_learning_objective: zero_sum
    adversary_move_prob: 1.0
    adversary_learning_epsilon_start: 0.8
    adversary_learning_epsilon_end: 0.05
    adversary_learning_epsilon_decay_episodes: 20000
    adversary_learning_alpha: 0.3
    adversary_freeze_episode: 20000

eval:
  ood_layout_count: 10

experiment: {}
