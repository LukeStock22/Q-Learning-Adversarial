# Heuristic learned adversary + active params.
# Key change from la_ic_ds: heuristic objective but now move_prob=1.0,
# epsilon_start=0.8, alpha=0.3, 40k episodes (la_ic_ds used all defaults + 5k eps).
# Hypothesis: heuristic gives denser step-wise reward (distance reduction + catch bonus)
# which should let the adversary learn pursuit faster than zero-sum (sparse ±2/step).
# Best prior OOD result for any learned adversary was la_ic_ds (-63.61 A→A OOD).

state_features:
  include_relative_package_destination: true

rewards:
  distance_shaping_enabled: true
  distance_shaping_scale: 1.0

run:
  debug:
    train_episodes: 40000

scenarios:
  adversary:
    adversary_policy: learning
    adversary_learning_objective: heuristic
    adversary_move_prob: 1.0
    adversary_learning_epsilon_start: 0.8
    adversary_learning_epsilon_end: 0.05
    adversary_learning_epsilon_decay_episodes: 20000
    adversary_learning_alpha: 0.3

eval:
  ood_layout_count: 10

experiment: {}
training: {}
